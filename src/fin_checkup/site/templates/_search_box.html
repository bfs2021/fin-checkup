{% set sid = search_id | default('top') %}
<form class="fc-search" role="search" action="{{ url('') }}" method="get">
  <label class="fc-visually-hidden" for="fc-q-{{ sid }}">회사 검색</label>
  <input id="fc-q-{{ sid }}" class="fc-search-input" type="search" name="q"
         placeholder="회사 이름 · 종목코드 · 초성(ㅅㅅㅈㅈ)" autocomplete="off" spellcheck="false"
         role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="fc-r-{{ sid }}">
  <ul class="fc-results" id="fc-r-{{ sid }}" role="listbox" aria-label="검색 결과" hidden></ul>
</form>
