name: 버그
description: 명령·화면·사이트가 기대와 다르게 동작한다 (숫자 자체가 DART 와 다르면 "데이터가 이상해요")
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나
      description: 한 일 → 기대한 결과 → 실제 결과
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      description: 실행한 명령이나 사이트 주소. 오류 메시지는 그대로 붙여 주세요 (DART 인증키가 들어 있으면 지우고).
      render: shell
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: 어디서
      description: "예: CLI checkup · Streamlit · 정적 사이트 · API · 텔레그램 알림"
  - type: input
    id: env
    attributes:
      label: 환경
      description: "OS · Python 버전 · 커밋 (git rev-parse --short HEAD)"
