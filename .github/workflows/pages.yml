name: Pages

# 공개 스냅샷(data-* 릴리스) → 캐시 재구성 → 정적 사이트 빌드 → GitHub Pages.
#
# 사이트 빌드는 캐시만 읽는다(DART 호출 0). 캐시는 로컬에서 수집한 것을
# `scripts/publish_snapshot.sh` 가 허용목록 테이블만 뽑아 릴리스로 올린다 —
# 개인정보·운영 테이블은 스냅샷에 아예 없다(snapshot.py).
#
# DART 를 부르는 건 "최근 위험 공시" 한 단계뿐이고, secret DART_API_KEY 가 있을 때만 돈다.
# 키는 그 단계의 env 로만 넘긴다(로그·산출물에 안 남게). 같은 키를 로컬 수집이 함께 쓰면
# 일별 허용량을 나눠 쓰게 되므로 --max-pages 로 최대 호출 수를 묶는다(5 × 30 = 150).

on:
  workflow_dispatch:
    inputs:
      year:
        description: "기준 사업연도 (비우면 빌더 기본값)"
        required: false
        default: ""
  release:
    types: [published]
  schedule:
    - cron: "0 22 * * *" # 매일 07:00 KST

permissions:
  contents: read

# 배포는 한 번에 하나만. 진행 중인 배포를 끊으면 사이트가 반쯤 바뀐 채 남을 수 있다.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://younghwan91.github.io/fin-checkup/
  # pydantic-settings 가 읽는다. 워크스페이스 안의 새 파일 — .env 는 없다.
  FIN_CHECKUP_DB_PATH: _snapshot/fin_checkup.duckdb

jobs:
  build:
    # 코드 릴리스가 생겨도 데이터 릴리스(data-*)일 때만 돈다.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'data-')
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.snapshot.outputs.found }}
    steps:
      - uses: actions/checkout@v7

      # setup-uv 는 메이저 이동 태그를 안 낸다 — ci.yml 과 같은 정확한 릴리스 태그로 고정한다.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: 의존성 설치 (lock 고정)
        run: uv sync --frozen

      - name: 스냅샷 릴리스 찾기
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,isDraft,createdAt \
              --jq '[.[] | select(.isDraft | not) | select(.tagName | startswith("data-"))]
                    | sort_by(.createdAt) | reverse | .[0].tagName // ""')"
          fi
          if [ -z "$tag" ]; then
            echo "::warning::data-* 스냅샷 릴리스가 없어 배포하지 않는다. scripts/publish_snapshot.sh 로 먼저 올릴 것."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p _download
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'snapshot-*.zip' --dir _download
          echo "스냅샷: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: 스냅샷으로 캐시 재구성
        if: steps.snapshot.outputs.found == 'true'
        run: |
          shopt -s nullglob
          zips=(_download/snapshot-*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::릴리스에 snapshot-*.zip 이 하나가 아니다: ${zips[*]}"
            exit 1
          fi
          mkdir -p _snapshot/files
          uv run python -m zipfile -e "${zips[0]}" _snapshot/files
          uv run python -m fin_checkup.cli snapshot import _snapshot/files --db "$FIN_CHECKUP_DB_PATH"

      - name: 최근 위험 공시 (DART_API_KEY 가 있을 때만)
        id: disclosures
        if: steps.snapshot.outputs.found == 'true'
        # DART 장애·한도 초과로 사이트 배포까지 막지 않는다. 실패하면 이번 빌드엔 공시가 빠진다.
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then
            echo "::notice::secret DART_API_KEY 가 없어 최근 위험 공시를 건너뛴다."
            exit 0
          fi
          uv run python -m fin_checkup.cli disclosures fetch --days 7 --max-pages 30 \
            --out _site-data/disclosures.json

      - name: 사이트 빌드
        if: steps.snapshot.outputs.found == 'true'
        env:
          YEAR: ${{ inputs.year }}
        run: |
          args=(--out site-out --base-url "$SITE_URL")
          if [ -n "$YEAR" ]; then args+=(--year "$YEAR"); fi
          uv run python -m fin_checkup.cli site build "${args[@]}"
          # 사이트 빌더가 공시를 읽게 되기 전까지(D3) 원자료를 정적 JSON 으로 함께 싣는다.
          if [ -f _site-data/disclosures.json ]; then
            mkdir -p site-out/data
            cp _site-data/disclosures.json site-out/data/disclosures.json
          fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.snapshot.outputs.found == 'true'
        with:
          path: site-out

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
